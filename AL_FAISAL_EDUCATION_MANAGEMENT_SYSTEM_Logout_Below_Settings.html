<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AL - FAISAL EDUCATION MANAGEMENT SYSTEM</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eff6ff,#f5f3ff 45%,#ecfeff)}
*{box-sizing:border-box}.shadow-card{box-shadow:0 8px 30px rgba(59,130,246,.10)}
.modal-bg{background:rgba(15,23,42,.55)}
@media print{.no-print{display:none!important}}
</style>

<style>
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#eff6ff,#f5f3ff 45%,#ecfeff)}
.auth-card{width:100%;max-width:440px;background:#fff;border-radius:24px;padding:30px;box-shadow:0 12px 40px rgba(15,23,42,.15)}
.auth-logo{text-align:center;font-size:44px;margin-bottom:8px}
.auth-card h1{text-align:center;margin:0;font-size:24px}.auth-sub{text-align:center;color:#64748b;margin:8px 0 24px}
.auth-card label{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
.auth-card input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px}
.auth-btn{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.auth-switch{text-align:center;margin-top:18px;color:#475569}.auth-switch button{border:0;background:none;color:#2563eb;font-weight:700;cursor:pointer}
.auth-msg{margin-top:12px;text-align:center;font-size:14px;min-height:20px}.auth-note{margin-top:18px;padding:12px;background:#f8fafc;border-radius:10px;font-size:12px;color:#64748b}
</style>

</head>
<body>
<div id="auth-root">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">🎓</div>
      <h1>AL - FAISAL EDUCATION MANAGEMENT SYSTEM</h1>
      <p class="auth-sub" id="auth-sub">Register to create your account</p>

      <form id="register-form">
        <label>Full Name</label>
        <input id="reg-name" type="text" required placeholder="Enter your name">
        <label>Email Address</label>
        <input id="reg-email" type="email" required placeholder="Enter your email">
        <label>Password</label>
        <input id="reg-password" type="password" required minlength="4" placeholder="Create password">
        <button class="auth-btn" type="submit">Create Account & Open System</button>
        <div class="auth-switch">Already registered? <button type="button" onclick="showLogin()">Login</button></div>
      </form>

      <form id="login-form" style="display:none">
        <label>Email Address</label>
        <input id="login-email" type="email" required placeholder="Enter registered email">
        <label>Password</label>
        <input id="login-password" type="password" required placeholder="Enter password">
        <button class="auth-btn" type="submit">Login & Open System</button>
        <div class="auth-switch">New user? <button type="button" onclick="showRegister()">Register</button></div>
      </form>
      <div class="auth-msg" id="auth-msg"></div>
      <div class="auth-note">Offline account mode: you can Register, Login and Logout. Account and session data are saved only on this device using Local Storage.</div>
    </div>
  </div>
</div>
<div id="root" style="display:none"></div>
<script>
const AUTH_USERS_KEY="fps_offline_users_v1";
const AUTH_SESSION_KEY="fps_offline_session_v1";
const getUsers=()=>{try{return JSON.parse(localStorage.getItem(AUTH_USERS_KEY)||"[]")}catch(e){return[]}};
const saveUsers=u=>localStorage.setItem(AUTH_USERS_KEY,JSON.stringify(u));
function openSystem(){document.getElementById("auth-root").style.display="none";document.getElementById("root").style.display="block"}
function logoutSystem(){if(!confirm("Do you want to logout?"))return;localStorage.removeItem(AUTH_SESSION_KEY);document.getElementById("root").style.display="none";document.getElementById("auth-root").style.display="block";showLogin();document.getElementById("login-password").value="";document.getElementById("auth-msg").textContent="You have been logged out successfully."}
function showLogin(){document.getElementById("register-form").style.display="none";document.getElementById("login-form").style.display="block";document.getElementById("auth-sub").textContent="Login with your registered email and password";document.getElementById("auth-msg").textContent=""}
function showRegister(){document.getElementById("login-form").style.display="none";document.getElementById("register-form").style.display="block";document.getElementById("auth-sub").textContent="Register to create your account";document.getElementById("auth-msg").textContent=""}
document.getElementById("register-form").addEventListener("submit",function(e){e.preventDefault();let name=document.getElementById("reg-name").value.trim(),email=document.getElementById("reg-email").value.trim().toLowerCase(),password=document.getElementById("reg-password").value;let users=getUsers();let msg=document.getElementById("auth-msg");if(users.some(u=>u.email===email)){msg.style.color="#dc2626";msg.textContent="This email is already registered. Please login.";return}users.push({id:Date.now().toString(36),name,email,password});saveUsers(users);localStorage.setItem(AUTH_SESSION_KEY,email);msg.style.color="#16a34a";msg.textContent="Registration successful. Opening system...";setTimeout(openSystem,300)});
document.getElementById("login-form").addEventListener("submit",function(e){e.preventDefault();let email=document.getElementById("login-email").value.trim().toLowerCase(),password=document.getElementById("login-password").value;let user=getUsers().find(u=>u.email===email&&u.password===password),msg=document.getElementById("auth-msg");if(!user){msg.style.color="#dc2626";msg.textContent="Incorrect email or password.";return}localStorage.setItem(AUTH_SESSION_KEY,email);msg.style.color="#16a34a";msg.textContent="Login successful. Opening system...";setTimeout(openSystem,300)});
if(localStorage.getItem(AUTH_SESSION_KEY)){openSystem()}
</script>
<script type="text/babel">
const {useState,useEffect,useMemo}=React;
const K={students:"fps_students_v4",fees:"fps_fees_v4",expenses:"fps_expenses_v4",salaries:"fps_salaries_v4",teachers:"fps_teachers_v4"};
const load=k=>{try{return JSON.parse(localStorage.getItem(k)||"[]")}catch{return[]}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const today=()=>{let d=new Date(),o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)};
const thisMonth=()=>today().slice(0,7);
const money=v=>"Rs. "+Number(v||0).toLocaleString("en-PK");
const dateFmt=v=>v?new Date(v+"T00:00:00").toLocaleDateString("en-PK",{year:"numeric",month:"short",day:"numeric"}):"-";
const monthFmt=v=>{if(!v)return"-";let [y,m]=v.split("-");return new Date(+y,+m-1,1).toLocaleDateString("en-US",{month:"long",year:"numeric"})};

function Icon({n}){return <span className="inline-flex items-center justify-center text-lg">{({dashboard:"📊",students:"🎓",fees:"💰",expenses:"💸",salary:"💵",teacher:"👨‍🏫",plus:"＋",edit:"✏️",del:"🗑️",search:"🔎",menu:"☰",close:"✕",save:"💾",warn:"⚠️",chart:"📈",attendance:"📅"}[n]||"•")}</span>}

function App(){
 const [students,setStudents]=useState(()=>load(K.students)),[fees,setFees]=useState(()=>load(K.fees)),[expenses,setExpenses]=useState(()=>load(K.expenses)),[salaries,setSalaries]=useState(()=>load(K.salaries)),[teachers,setTeachers]=useState(()=>load(K.teachers)),[copies,setCopies]=useState(()=>load("copies")),[attendance,setAttendance]=useState(()=>load("teacher_attendance"));
 const [tab,setTab]=useState("dashboard"),[mobile,setMobile]=useState(false),[feeMonth,setFeeMonth]=useState(thisMonth()),[reportPeriod,setReportPeriod]=useState("Monthly"),[reportDate,setReportDate]=useState(today());
 const [schoolName,setSchoolName]=useState(()=>localStorage.getItem("school_name")||"Faisal Public High School");
 const [deleted,setDeleted]=useState(()=>load("fps_deleted_v1"));
 const [modal,setModal]=useState(null),[editing,setEditing]=useState(null),[search,setSearch]=useState("");
 useEffect(()=>localStorage.setItem("school_name",schoolName),[schoolName]);
 useEffect(()=>save(K.students,students),[students]);useEffect(()=>save(K.fees,fees),[fees]);useEffect(()=>save(K.expenses,expenses),[expenses]);useEffect(()=>save(K.salaries,salaries),[salaries]);useEffect(()=>save(K.teachers,teachers),[teachers]); useEffect(()=>save("copies",copies),[copies]);useEffect(()=>save("teacher_attendance",attendance),[attendance]); useEffect(()=>save("fps_deleted_v1",deleted),[deleted]);
 // Automatic safety snapshot: keeps the latest complete data set inside the browser.
 useEffect(()=>{try{localStorage.setItem("al_faisal_auto_backup_v1",JSON.stringify({version:1,createdAt:new Date().toISOString(),schoolName,students,fees,expenses,salaries,teachers,copies,attendance,deleted}))}catch(e){}},[schoolName,students,fees,expenses,salaries,teachers,copies,attendance,deleted]);
 const fullBackup=()=>({app:"AL - FAISAL EDUCATION MANAGEMENT SYSTEM",version:1,createdAt:new Date().toISOString(),schoolName,students,fees,expenses,salaries,teachers,copies,attendance,deleted});
 const downloadBackup=()=>{const b=new Blob([JSON.stringify(fullBackup(),null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="AL_FAISAL_Backup_"+today()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
 const restoreBackup=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!confirm("Restore this backup? Current data will be replaced."))return;setSchoolName(d.schoolName||schoolName);setStudents(d.students||[]);setFees(d.fees||[]);setExpenses(d.expenses||[]);setSalaries(d.salaries||[]);setTeachers(d.teachers||[]);setCopies(d.copies||[]);setAttendance(d.attendance||[]);setDeleted(d.deleted||[]);alert("Backup restored successfully.")}catch(err){alert("Invalid backup file.")}};r.readAsText(f);e.target.value=""};
 const restoreAutoBackup=()=>{try{const d=JSON.parse(localStorage.getItem("al_faisal_auto_backup_v1")||"null");if(!d){alert("No automatic backup found.");return}if(!confirm("Restore the latest automatic backup? Current data will be replaced."))return;setSchoolName(d.schoolName||schoolName);setStudents(d.students||[]);setFees(d.fees||[]);setExpenses(d.expenses||[]);setSalaries(d.salaries||[]);setTeachers(d.teachers||[]);setCopies(d.copies||[]);setAttendance(d.attendance||[]);setDeleted(d.deleted||[]);alert("Automatic backup restored.")}catch(e){alert("Automatic backup could not be restored.")}};

 const m=thisMonth(),td=today();
 const expectedFee=students.filter(x=>x.status!=="Inactive"&&x.feeType!=="Free").reduce((a,x)=>a+(+x.monthlyFee||0),0); const monthlyFees=fees.filter(x=>(x.month||x.date?.slice(0,7))===m&&x.paymentStatus==="Paid").reduce((a,x)=>a+ +x.amount,0); const paidFee=monthlyFees; const remainingFee=Math.max(0,expectedFee-paidFee);
 const todayFees=fees.filter(x=>x.date===td&&x.paymentStatus==="Paid").reduce((a,x)=>a+ +x.amount,0);
 const monthlySalary=salaries.filter(x=>x.month===m).reduce((a,x)=>a+ +x.amount,0);
 const monthlyExpense=expenses.filter(x=>(x.month||x.date?.slice(0,7))===m).reduce((a,x)=>a+ +x.amount,0);
 const net=monthlyFees-monthlyExpense;
 const activeTeachers=teachers.filter(t=>t.status!=="Inactive").length;
 const activeStudents=students.filter(s=>s.status!=="Inactive").length;
 const defaulters=students.filter(s=>s.status!=="Inactive"&&s.feeType!=="Free"&&!fees.some(f=>String(f.studentId)===String(s.id)&&(f.month||f.date?.slice(0,7))===m&&f.paymentStatus==="Paid"));

 function nav(t){setTab(t);setMobile(false);setSearch("")}
 function close(){setModal(null);setEditing(null)}
 function submitStudent(d){editing?setStudents(a=>a.map(x=>x.id===editing.id?{...d,id:x.id}:x)):setStudents(a=>[...a,{...d,id:uid()}]);close()}
 function submitTeacher(d){
   if(editing)setTeachers(a=>a.map(x=>x.id===editing.id?{...d,id:x.id}:x));
   else setTeachers(a=>[...a,{...d,id:uid()}]); close()
 }
 function submitFee(d){let st=students.find(x=>String(x.id)===String(d.studentId));d.studentName=st?.name||"Unknown";editing?setFees(a=>a.map(x=>x.id===editing.id?{...d,id:x.id}:x)):setFees(a=>[...a,{...d,id:uid()}]);close()}
 function submitExpense(d){editing?setExpenses(a=>a.map(x=>x.id===editing.id?{...d,id:x.id,autoSalaryId:x.autoSalaryId||null}:x)):setExpenses(a=>[...a,{...d,id:uid(),autoSalaryId:null}]);close()}
 function submitSalary(d){
   if(editing){
     setSalaries(a=>a.map(x=>x.id===editing.id?{...d,id:x.id}:x));
     setExpenses(a=>a.map(e=>e.autoSalaryId===editing.id?{...e,name:`Teacher Salary - ${d.teacherName} - ${monthFmt(d.month)}`,amount:+d.amount,date:d.paymentDate,month:d.month,notes:d.notes||""}:e));
   }else{
     let id=uid();setSalaries(a=>[...a,{...d,id}]);
     setExpenses(a=>[...a,{id:uid(),name:`Teacher Salary - ${d.teacherName} - ${monthFmt(d.month)}`,amount:+d.amount,date:d.paymentDate,month:d.month,notes:d.notes||"",autoSalaryId:id,expenseType:"Teacher Salary"}]);
   } close()
 }
 function del(type,id){
   if(!confirm("Delete this record? You can restore it later from Backup."))return;
   const source={student:students,teacher:teachers,fee:fees,expense:expenses,salary:salaries,copy:copies}[type]||[]; const item=source.find(x=>x.id===id); if(item)setDeleted(a=>[{id:uid(),type,item,deletedAt:new Date().toISOString()},...a]);
   if(type==="student")setStudents(a=>a.filter(x=>x.id!==id));
   if(type==="teacher")setTeachers(a=>a.filter(x=>x.id!==id));
   if(type==="fee")setFees(a=>a.filter(x=>x.id!==id));
   if(type==="expense"){let e=expenses.find(x=>x.id===id);if(e?.autoSalaryId){alert("Delete this expense from Teacher Salary.");return}setExpenses(a=>a.filter(x=>x.id!==id))}
   if(type==="salary"){setSalaries(a=>a.filter(x=>x.id!==id));setExpenses(a=>a.filter(x=>x.autoSalaryId!==id))}
   if(type==="copy")setCopies(a=>a.filter(x=>x.id!==id));
 }
 const navs=[["dashboard","Dashboard","dashboard"],["students","Students","students"],["fees","Fee Collection","fees"],["expenses","Expenses","expenses"],["salary","Teacher Salary","salary"],["teachers","Teacher Service","teacher"],["classes","Classes","students"],["reports","Reports","chart"],["copies","Copies","fees"],["backup","💾 Backup","backup"],["settings","⚙ Settings","settings"],["logout","🚪 Logout","close"]];
 return <div className="min-h-screen">
  {mobile&&<div className="fixed inset-0 bg-black/40 z-40 lg:hidden" onClick={()=>setMobile(false)}/>}
  <aside className={`fixed z-50 inset-y-0 left-0 w-72 bg-slate-950 text-white flex flex-col transition-transform ${mobile?"translate-x-0":"-translate-x-full"} lg:translate-x-0`}>
   <div className="p-5 border-b border-slate-800 flex justify-between shrink-0"><div><div className="text-3xl">🎓</div><div className="text-[11px] font-bold tracking-wide text-cyan-300 leading-tight mb-1">AL - FAISAL EDUCATION MANAGEMENT SYSTEM</div><b className="text-lg">{schoolName}</b></div><button className="lg:hidden" onClick={()=>setMobile(false)}><Icon n="close"/></button></div>
   <nav className="p-4 space-y-2 flex-1 min-h-0 overflow-y-auto overflow-x-hidden">{navs.map(([id,label,ic])=><button key={id} onClick={()=>id==="logout"?logoutSystem():nav(id)} className={`w-full text-left p-3 rounded-xl flex gap-3 items-center ${tab===id?"bg-blue-600":"hover:bg-slate-800 text-slate-300"}`}><Icon n={ic}/>{label}</button>)}</nav>
   <div className="w-full p-4 shrink-0"><div className="bg-slate-900 rounded-xl p-3 text-sm text-green-400">✓ Local Storage Active</div></div>
  </aside>
  <main className="lg:ml-72">
   <header className="sticky top-0 z-30 bg-white border-b p-4 flex items-center justify-between gap-3"><div className="flex items-center gap-3"><button className="lg:hidden" onClick={()=>setMobile(true)}><Icon n="menu"/></button><div><h1 className="text-xl font-bold">{navs.find(x=>x[0]===tab)?.[1]}</h1><p className="text-xs text-slate-500">AL - FAISAL EDUCATION MANAGEMENT SYSTEM</p></div></div></header>
   <div className="p-4 sm:p-6">
    {tab==="dashboard"&&<Dashboard students={students} teachers={teachers} fees={fees} expenses={expenses} salaries={salaries} copies={copies} monthlyFees={monthlyFees} paidFee={paidFee} remainingFee={remainingFee} expectedFee={expectedFee} todayFees={todayFees} monthlySalary={monthlySalary} monthlyExpense={monthlyExpense} net={net} activeStudents={activeStudents} activeTeachers={activeTeachers} defaulters={defaulters} month={m} nav={nav} schoolName={schoolName}/>}


    {tab==="backup"&&<div className="space-y-5"><div className="bg-white rounded-2xl p-6 shadow-card border"><h2 className="text-2xl font-extrabold">Backup & Restore</h2><p className="text-slate-500 mt-2">Protect all school data with full backup, restore, automatic safety snapshots and deleted-record recovery.</p><div className="flex flex-wrap gap-3 mt-4"><button onClick={downloadBackup} className="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold">💾 Download Full Backup</button><label className="bg-green-600 text-white px-4 py-2 rounded-xl font-bold cursor-pointer">📤 Restore Backup<input type="file" accept="application/json,.json" className="hidden" onChange={restoreBackup}/></label><button onClick={restoreAutoBackup} className="bg-purple-600 text-white px-4 py-2 rounded-xl font-bold">🔄 Restore Latest Auto Backup</button></div><p className="text-xs text-slate-400 mt-3">Recommendation: download a full backup regularly and keep it outside the browser/device.</p></div><Records title={`Deleted Records (${deleted.length})`} desc="Restore or permanently remove deleted records." add="" search={search} setSearch={setSearch} rows={deleted.filter(x=>`${x.type} ${JSON.stringify(x.item)}`.toLowerCase().includes(search.toLowerCase()))} cols={["Type","Record","Deleted"]} render={x=><><td className="p-3 font-semibold capitalize">{x.type}</td><td className="p-3">{x.item.name||x.item.studentName||x.item.teacherName||"Record"}</td><td className="p-3">{new Date(x.deletedAt).toLocaleString()}</td></>} onAdd={null} onEdit={x=>{const map={student:setStudents,teacher:setTeachers,fee:setFees,expense:setExpenses,salary:setSalaries,copy:setCopies};map[x.type]?.(a=>[...a,x.item]);setDeleted(a=>a.filter(z=>z.id!==x.id));alert("Record restored successfully!")}} onDelete={x=>{if(confirm("Permanently delete this backup?"))setDeleted(a=>a.filter(z=>z.id!==x.id))}}/></div>}
    {tab==="copies"&&<Copies students={students} copies={copies} setCopies={setCopies} del={del}/>}
    {tab==="settings"&&<div className="max-w-2xl bg-white rounded-2xl p-6 shadow-card border border-slate-200"><h2 className="text-2xl font-extrabold mb-2">School Settings</h2><p className="text-slate-500 mb-5">Change your school name. The new name will be saved on this device.</p><label className="block text-sm font-semibold mb-2">School Name</label><input className="w-full border rounded-xl p-3" value={schoolName} onChange={e=>setSchoolName(e.target.value)} placeholder="Enter school name"/><button className="mt-5 px-5 py-3 rounded-xl bg-blue-600 text-white font-bold" onClick={()=>{localStorage.setItem("school_name",schoolName);alert("School name saved successfully!")}}>Save Changes</button></div>}
    {tab==="students"&&<Records title={`Students (${students.length})`} desc="Manage student records." add="Add Student" search={search} setSearch={setSearch} rows={students.filter(x=>`${x.name} ${x.fatherName} ${x.className} ${x.rollNo}`.toLowerCase().includes(search.toLowerCase()))} cols={["Student","Father","Class","Roll No.","Fee Type","Monthly Fee","Status"]} render={x=><>{<td className="p-3 font-semibold">{x.name}</td>}<td className="p-3">{x.fatherName||"-"}</td><td className="p-3">{x.className||"-"}</td><td className="p-3">{x.rollNo||"-"}</td><td className="p-3 text-center">{x.feeType==="Free"?"🎓 Free":"💰 Paid"}</td><td className="p-3 text-right">{x.feeType==="Free"?"Free":money(x.monthlyFee)}</td><td className="p-3 text-center">{x.status||"Active"}</td></>} onAdd={()=>setModal("student")} onEdit={x=>{setEditing(x);setModal("student")}} onDelete={x=>del("student",x.id)}/>}
    {tab==="teachers"&&<Records title={`Teacher Service (${teachers.length})`} desc="Manage teacher service and employment records." add="Add Teacher" search={search} setSearch={setSearch} rows={teachers.filter(x=>`${x.name} ${x.subject} ${x.qualification} ${x.phone}`.toLowerCase().includes(search.toLowerCase()))} cols={["Teacher","Subject","Qualification","Joining Date","Monthly Salary","Status"]} render={x=><><td className="p-3 font-semibold">{x.name}</td><td className="p-3">{x.subject||"-"}</td><td className="p-3">{x.qualification||"-"}</td><td className="p-3">{dateFmt(x.joiningDate)}</td><td className="p-3 text-right">{money(x.monthlySalary)}</td><td className="p-3 text-center">{x.status||"Active"}</td></>} onAdd={()=>setModal("teacher")} onEdit={x=>{setEditing(x);setModal("teacher")}} onDelete={x=>del("teacher",x.id)}/>}
    {tab==="fees"&&<div className="space-y-5">
      {(()=>{const mf=fees.filter(x=>x.month===feeMonth);const active=students.filter(s=>s.status!=="Inactive"&&s.feeType!=="Free");const expected=active.reduce((a,x)=>a+(+x.monthlyFee||0),0);const collected=mf.filter(x=>x.paymentStatus==="Paid").reduce((a,x)=>a+(+x.amount||0),0);const outstanding=Math.max(0,expected-collected);const defaulters=active.filter(st=>!mf.some(f=>String(f.studentId)===String(st.id)&&f.paymentStatus==="Paid")).length;return <>
       <div className="bg-white rounded-2xl p-5 shadow-card border border-blue-100 flex flex-col sm:flex-row sm:items-end justify-between gap-4">
        <div><h2 className="text-xl font-extrabold">Fee Collection</h2><p className="text-sm text-slate-500">Select a month to view fee summary.</p></div>
        <label className="block"><span className="block text-sm font-semibold mb-1">Select Month</span><input type="month" value={feeMonth} onChange={e=>setFeeMonth(e.target.value)} className="border rounded-xl px-4 py-2.5 outline-none focus:ring-2 focus:ring-blue-500"/></label>
       </div>
       <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
        <div className="bg-blue-600 text-white rounded-2xl p-5 shadow-card"><p className="text-sm opacity-80">Expected Fee</p><h3 className="text-2xl font-extrabold mt-2">{money(expected)}</h3><p className="text-xs mt-2 opacity-80">{monthFmt(feeMonth)}</p></div>
        <div className="bg-green-600 text-white rounded-2xl p-5 shadow-card"><p className="text-sm opacity-80">Collected Fee</p><h3 className="text-2xl font-extrabold mt-2">{money(collected)}</h3><p className="text-xs mt-2 opacity-80">{monthFmt(feeMonth)}</p></div>

const Sel=({label,children,...p})=><label className="block"><span className="block text-sm font-semibold mb-1">{label}</span><select {...p} className="w-full border rounded-lg p-2.5 bg-white outline-none focus:ring-2 focus:ring-blue-500">{children}</select></label>;
const Area=({label,...p})=><label className="block"><span className="block text-sm font-semibold mb-1">{label}</span><textarea {...p} className="w-full border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500"/></label>;
function Custom({fields,setFields}){function add(){setFields([...fields,{id:uid(),name:"",value:""}])}return <div className="mt-5 pt-5 border-t"><div className="flex justify-between mb-3"><b>Custom Fields</b><button type="button" onClick={add} className="text-blue-600 font-semibold">+ Add Custom Field</button></div>{fields.map(f=><div className="grid sm:grid-cols-[1fr_1fr_auto] gap-2 mb-2" key={f.id}><input value={f.name} onChange={e=>setFields(fields.map(x=>x.id===f.id?{...x,name:e.target.value}:x))} placeholder="Field name" className="border rounded-lg p-2"/><input value={f.value} onChange={e=>setFields(fields.map(x=>x.id===f.id?{...x,value:e.target.value}:x))} placeholder="Value" className="border rounded-lg p-2"/><button type="button" onClick={()=>setFields(fields.filter(x=>x.id!==f.id))} className="bg-red-50 text-red-600 rounded-lg px-3">🗑️</button></div>)}</div>}
function Buttons({close,text}){return <div className="flex justify-end gap-2 mt-6 pt-4 border-t"><button type="button" onClick={close} className="border px-5 py-2.5 rounded-lg">Cancel</button><button className="bg-blue-600 text-white px-5 py-2.5 rounded-lg">{text}</button></div>}
function StudentModal({initial,close,save}){
 let[f,setF]=useState({name:initial?.name||"",fatherName:initial?.fatherName||"",className:initial?.className||"",rollNo:initial?.rollNo||"",monthlyFee:initial?.monthlyFee||"",feeType:initial?.feeType||"Paid",admissionDate:initial?.admissionDate||today(),phone:initial?.phone||"",address:initial?.address||"",status:initial?.status||"Active",notes:initial?.notes||""}),[cf,setCf]=useState(initial?.customFields||[]);
 const setFeeType=v=>setF({...f,feeType:v,monthlyFee:v==="Free"?0:f.monthlyFee});
 return <Modal title={initial?"Edit Student":"Add Student"} close={close}>
  <form onSubmit={e=>{e.preventDefault();save({...f,monthlyFee:f.feeType==="Free"?0:+f.monthlyFee,customFields:cf})}}>
   <div className="grid sm:grid-cols-2 gap-4">
    <In label="Student Name" required value={f.name} onChange={e=>setF({...f,name:e.target.value})}/>
    <In label="Father Name" value={f.fatherName} onChange={e=>setF({...f,fatherName:e.target.value})}/>
    <Sel label="Class" value={f.className} onChange={e=>setF({...f,className:e.target.value})}>
     <option value="">Select Class</option><option>Play Group</option><option>Nursery</option><option>Prep</option><option>1st</option><option>2nd</option><option>3rd</option><option>4th</option><option>5th</option><option>6th</option><option>7th</option><option>8th</option><option>9th</option><option>10th</option>
    </Sel>
    <In label="Roll Number" value={f.rollNo} onChange={e=>setF({...f,rollNo:e.target.value})}/>
    <Sel label="Student Fee Type" value={f.feeType} onChange={e=>setFeeType(e.target.value)}><option value="Paid">💰 Paid Student</option><option value="Free">🎓 Free Student</option></Sel>
    <In label={f.feeType==="Free"?"Monthly Fee (Free Student)":"Monthly Fee"} type="number" value={f.feeType==="Free"?0:f.monthlyFee} disabled={f.feeType==="Free"} onChange={e=>setF({...f,monthlyFee:e.target.value})}/>
    <In label="Admission Date" type="date" value={f.admissionDate} onChange={e=>setF({...f,admissionDate:e.target.value})}/>
    <In label="Phone" value={f.phone} onChange={e=>setF({...f,phone:e.target.value})}/>
    <Sel label="Status" value={f.status} onChange={e=>setF({...f,status:e.target.value})}><option>Active</option><option>Inactive</option></Sel>
   </div>
   {f.feeType==="Free"&&<div className="mt-4 p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 font-semibold">🎓 This student is marked as FREE. No monthly fee will be expected and the student will not appear in fee defaulters.</div>}
   <div className="mt-4"><Area label="Address" rows="2" value={f.address} onChange={e=>setF({...f,address:e.target.value})}/></div>
   <div className="mt-4"><Area label="Notes" rows="2" value={f.notes} onChange={e=>setF({...f,notes:e.target.value})}/></div>
   <Custom fields={cf} setFields={setCf}/><Buttons close={close} text={initial?"Update Student":"Add Student"}/>
  </form>
 </Modal>
}
function TeacherModal({initial,close,save}){let[f,setF]=useState({name:initial?.name||"",fatherName:initial?.fatherName||"",cnic:initial?.cnic||"",phone:initial?.phone||"",subject:initial?.subject||"",qualification:initial?.qualification||"",joiningDate:initial?.joiningDate||today(),status:initial?.status||"Active",monthlySalary:initial?.monthlySalary||"",address:initial?.address||"",notes:initial?.notes||""}),[cf,setCf]=useState(initial?.customFields||[]);let ch=(k,v)=>setF({...f,[k]:v});return <Modal title={initial?"Edit Teacher Service":"Add Teacher Service"} close={close}><form onSubmit={e=>{e.preventDefault();save({...f,monthlySalary:+f.monthlySalary,customFields:cf})}}><div className="grid sm:grid-cols-2 gap-4"><In label="Teacher Name" required value={f.name} onChange={e=>ch("name",e.target.value)}/><In label="Father Name" value={f.fatherName} onChange={e=>ch("fatherName",e.target.value)}/><In label="CNIC / ID" value={f.cnic} onChange={e=>ch("cnic",e.target.value)}/><In label="Phone Number" value={f.phone} onChange={e=>ch("phone",e.target.value)}/><In label="Subject" value={f.subject} onChange={e=>ch("subject",e.target.value)}/><In label="Qualification" value={f.qualification} onChange={e=>ch("qualification",e.target.value)}/><In label="Joining Date" type="date" value={f.joiningDate} onChange={e=>ch("joiningDate",e.target.value)}/><Sel label="Service Status" value={f.status} onChange={e=>ch("status",e.target.value)}><option>Active</option><option>Inactive</option></Sel><In label="Monthly Salary" type="number" value={f.monthlySalary} onChange={e=>ch("monthlySalary",e.target.value)}/></div><div className="mt-4"><Area label="Address" rows="2" value={f.address} onChange={e=>ch("address",e.target.value)}/></div><div className="mt-4"><Area label="Notes" rows="2" value={f.notes} onChange={e=>ch("notes",e.target.value)}/></div><Custom fields={cf} setFields={setCf}/><Buttons close={close} text={initial?"Update Teacher":"Add Teacher"}/></form></Modal>}
function FeeModal({initial,students,selectedMonth,close,save}){
 let[f,setF]=useState({
  studentId:initial?.studentId||"",
  studentName:initial?.studentName||"",
  className:initial?.className||"",
  amount:initial?.amount||"",
  month:initial?.month||selectedMonth||thisMonth(),
  date:initial?.date||today(),
  paymentStatus:initial?.paymentStatus||"Paid",
  notes:initial?.notes||""
 }),[cf,setCf]=useState(initial?.customFields||[]),[studentSearch,setStudentSearch]=useState(initial?.studentName||"");
 let ch=(k,v)=>setF({...f,[k]:v});
 const feeStudents=students.filter(s=>s.status!=="Inactive"&&s.feeType!=="Free");
 const searchedStudents=feeStudents.filter(s=>`${s.name||""} ${s.fatherName||""} ${s.className||""} ${s.rollNo||""}`.toLowerCase().includes(studentSearch.toLowerCase()));
 function studentChange(v){
  let st=students.find(x=>String(x.id)===String(v));
  setF({...f,studentId:v,studentName:st?.name||"",className:st?.className||"",amount:st?.monthlyFee||""});
 }
 return <Modal title={initial?"Edit Fee":"Add Fee"} close={close}>
  <form onSubmit={e=>{e.preventDefault();if(!f.studentId){alert("Please select a student.");return}save({...f,amount:+f.amount,customFields:cf})}}>
   <div className="grid sm:grid-cols-2 gap-4">
    <In label="🔎 Search Student" value={studentSearch} onChange={e=>setStudentSearch(e.target.value)} placeholder="Type student name, father name, class or roll no..."/>
    <Sel label="Student Name" required value={f.studentId} onChange={e=>studentChange(e.target.value)}>
     <option value="">{studentSearch?`${searchedStudents.length} matching student(s)`:"Select Student"}</option>
     {searchedStudents.map(s=><option key={s.id} value={s.id}>{s.name}{s.className?` — ${s.className}`:""}{s.rollNo?` (Roll: ${s.rollNo})`:""}</option>)}
    </Sel>
    <In label="Class" value={f.className} readOnly placeholder="Auto from Student"/>
    <In label="Monthly Fee" required type="number" value={f.amount} readOnly placeholder="Auto from Student"/>
    <In label="Fee Month" required type="month" value={f.month} onChange={e=>ch("month",e.target.value)}/>
    <In label="Payment Date" type="date" value={f.date} onChange={e=>ch("date",e.target.value)}/>
   </div>
   <div className="mt-5">
    <span className="block text-sm font-semibold mb-2">Fee Status</span>
    <div className="grid grid-cols-2 gap-3">
     <button type="button" onClick={()=>ch("paymentStatus","Paid")} className={`p-3 rounded-xl border-2 font-bold ${f.paymentStatus==="Paid"?"border-green-500 bg-green-50 text-green-700":"border-slate-200 text-slate-500"}`}>✓ Paid</button>
     <button type="button" onClick={()=>ch("paymentStatus","Unpaid")} className={`p-3 rounded-xl border-2 font-bold ${f.paymentStatus==="Unpaid"?"border-red-500 bg-red-50 text-red-700":"border-slate-200 text-slate-500"}`}>✕ Unpaid</button>
    </div>
   </div>
   <div className="mt-4"><Area label="Notes" rows="3" value={f.notes} onChange={e=>ch("notes",e.target.value)}/></div>
   <Custom fields={cf} setFields={setCf}/>
   <div className="flex justify-end gap-2 mt-6 pt-4 border-t">
    <button type="button" onClick={close} className="border px-5 py-2.5 rounded-lg">Cancel</button>
    <button type="button" onClick={()=>{if(!f.studentId){alert("Please select a student.");return}save({...f,amount:+f.amount,paymentStatus:"Paid",date:f.date||today(),customFields:cf})}} className="bg-green-600 text-white px-5 py-2.5 rounded-lg font-semibold">✓ Mark as Paid & Save</button>
    <button type="submit" className="bg-blue-600 text-white px-5 py-2.5 rounded-lg">{initial?"Update Fee":"Save Fee"}</button>
   </div>
  </form>
 </Modal>
}
function ExpenseModal({initial,close,save}){let[f,setF]=useState({name:initial?.name||"",amount:initial?.amount||"",month:initial?.month||thisMonth(),date:initial?.date||today(),notes:initial?.notes||""}),[cf,setCf]=useState(initial?.customFields||[]);let ch=(k,v)=>setF({...f,[k]:v});return <Modal title={initial?"Edit Expense":"Add Expense"} close={close}><form onSubmit={e=>{e.preventDefault();save({...f,amount:+f.amount,customFields:cf})}}><div className="space-y-4"><In label="Expense Name" required value={f.name} onChange={e=>ch("name",e.target.value)}/><div className="grid sm:grid-cols-2 gap-4"><In label="Amount" required type="number" value={f.amount} onChange={e=>ch("amount",e.target.value)}/><In label="Date" type="date" value={f.date} onChange={e=>ch("date",e.target.value)}/><In label="Month" type="month" value={f.month} onChange={e=>ch("month",e.target.value)}/></div><Area label="Notes" rows="3" value={f.notes} onChange={e=>ch("notes",e.target.value)}/></div><Custom fields={cf} setFields={setCf}/><Buttons close={close} text={initial?"Update Expense":"Add Expense"}/></form></Modal>}
function TeacherAttendance({teachers,attendance,setAttendance}){const [date,setDate]=useState(today());const active=teachers.filter(t=>t.status!=="Inactive");const get=(id)=>attendance.find(a=>String(a.teacherId)===String(id)&&a.date===date);const mark=(t,status)=>{setAttendance(a=>{const old=a.find(x=>String(x.teacherId)===String(t.id)&&x.date===date);const rec={id:old?.id||uid(),teacherId:t.id,teacherName:t.name,date,status,createdAt:old?.createdAt||new Date().toISOString()};return old?a.map(x=>x.id===old.id?rec:x):[rec,...a]})};const counts=(id)=>attendance.filter(a=>String(a.teacherId)===String(id)&&a.date?.slice(0,7)===date.slice(0,7)).reduce((o,a)=>{o[a.status]=(o[a.status]||0)+1;return o},{Present:0,Absent:0,Leave:0,Late:0});return <div className="space-y-5"><div className="bg-white rounded-2xl p-6 shadow-card border"><div className="flex flex-wrap items-end justify-between gap-4"><div><h2 className="text-2xl font-extrabold">Teacher Attendance</h2><p className="text-slate-500">All teachers added in Teacher Service automatically appear below. Select a date and mark daily attendance.</p></div><div className="w-56"><In label="Attendance Date" type="date" value={date} onChange={e=>setDate(e.target.value)}/></div></div><div className="overflow-x-auto mt-5"><table className="w-full text-sm"><thead><tr className="bg-slate-100 text-left"><th className="p-3">Teacher Name</th><th className="p-3">Today Status</th><th className="p-3">Mark Attendance</th><th className="p-3">Monthly Summary</th></tr></thead><tbody>{active.length?active.map(t=>{const r=get(t.id),c=counts(t.id);return <tr key={t.id} className="border-t"><td className="p-3 font-bold">{t.name}</td><td className="p-3"><span className="px-3 py-1 rounded-full bg-slate-100 font-semibold">{r?.status||"Not Marked"}</span></td><td className="p-3"><div className="flex flex-wrap gap-2"><button onClick={()=>mark(t,"Present")} className="bg-green-600 text-white px-3 py-2 rounded-lg">Present</button><button onClick={()=>mark(t,"Absent")} className="bg-red-600 text-white px-3 py-2 rounded-lg">Absent</button><button onClick={()=>mark(t,"Leave")} className="bg-orange-500 text-white px-3 py-2 rounded-lg">Leave</button><button onClick={()=>mark(t,"Late")} className="bg-purple-600 text-white px-3 py-2 rounded-lg">Late</button></div></td><td className="p-3 text-xs">P: {c.Present} | A: {c.Absent} | L: {c.Leave} | Late: {c.Late}</td></tr>}) : <tr><td colSpan="4" className="p-6 text-center text-slate-500">No teachers added yet. Add teachers from Teacher Service first.</td></tr>}</tbody></table></div></div></div>}
function SalaryModal({initial,teachers,close,save}){let[f,setF]=useState({teacherId:initial?.teacherId||"",teacherName:initial?.teacherName||"",month:initial?.month||thisMonth(),amount:initial?.amount||"",paymentDate:initial?.paymentDate||today(),notes:initial?.notes||""}),[cf,setCf]=useState(initial?.customFields||[]);let ch=(k,v)=>setF({...f,[k]:v});function teacherChange(v){let t=teachers.find(x=>String(x.id)===String(v));setF({...f,teacherId:v,teacherName:t?.name||"",amount:t?.monthlySalary||f.amount})}return <Modal title={initial?"Edit Teacher Salary":"Add Teacher Salary"} close={close}><form onSubmit={e=>{e.preventDefault();save({...f,customFields:cf})}}><div className="grid sm:grid-cols-2 gap-4"><Sel label="Teacher Name" required value={f.teacherId} onChange={e=>teacherChange(e.target.value)}><option value="">Select Teacher</option>{teachers.map(t=><option key={t.id} value={t.id}>{t.name}{t.subject?" — "+t.subject:""}</option>)}</Sel><In label="Month" required type="month" value={f.month} onChange={e=>ch("month",e.target.value)}/><In label="Amount" required type="number" value={f.amount} onChange={e=>ch("amount",e.target.value)}/><In label="Payment Date" required type="date" value={f.paymentDate} onChange={e=>ch("paymentDate",e.target.value)}/></div><div className="mt-4"><Area label="Notes" rows="3" value={f.notes} onChange={e=>ch("notes",e.target.value)}/></div><div className="mt-4 p-3 bg-orange-50 rounded-lg text-sm text-orange-800">Saving this salary automatically creates an Expense: <b>Teacher Salary - {f.teacherName||"[Teacher Name]"} - {monthFmt(f.month)}</b></div><Custom fields={cf} setFields={setCf}/><Buttons close={close} text={initial?"Update Salary":"Add Salary"}/></form></Modal>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
