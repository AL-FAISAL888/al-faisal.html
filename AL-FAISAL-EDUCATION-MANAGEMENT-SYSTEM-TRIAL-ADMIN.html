firebase.initializeApp(firebaseConfig);

const WHATSAPP_NUMBER="03147597544";

async function ensureSubscription(user){
  if(!user) return null;
  if(user.uid===ADMIN_UID) return {plan:"admin",status:"active"};
  const ref=window.firebaseDb.collection("subscriptions").doc(user.uid);
  const snap=await ref.get();
  if(snap.exists) return snap.data();
  const now=new Date();
  const end=new Date(now.getTime()+3*24*60*60*1000);
  const data={email:(user.email||"").toLowerCase(),plan:"trial",status:"active",trialStart:firebase.firestore.Timestamp.fromDate(now),trialEnd:firebase.firestore.Timestamp.fromDate(end),expiresAt:firebase.firestore.Timestamp.fromDate(end),createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
  await ref.set(data,{merge:true});
  return data;
}
function subscriptionExpired(sub){
  if(!sub || sub.plan==="admin" || sub.plan==="lifetime") return false;
  const exp=sub.expiresAt||sub.trialEnd;
  if(!exp) return false;
  const ms=typeof exp.toMillis==="function"?exp.toMillis():new Date(exp).getTime();
  return Date.now()>=ms;
}
function showExpired(sub){
  document.getElementById("auth-root").style.display="none";
  document.getElementById("root").style.display="none";
  let box=document.getElementById("expired-root");
  if(!box){
    box=document.createElement("div"); box.id="expired-root";
    box.innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#eff6ff,#f5f3ff 45%,#ecfeff);font-family:Arial,sans-serif"><div style="width:100%;max-width:520px;background:#fff;border-radius:24px;padding:32px;box-shadow:0 12px 40px rgba(15,23,42,.15);text-align:center"><div style="font-size:54px">⏰</div><h1 style="font-size:28px;margin:12px 0">Free Trial Expired</h1><p style="color:#64748b;line-height:1.6">Your 3-day free trial has ended. Please contact us to activate your account.</p><div style="margin:24px 0;padding:18px;background:#f8fafc;border-radius:16px"><b>WhatsApp: ${WHATSAPP_NUMBER}</b><p style="margin:8px 0 0;color:#64748b;font-size:14px">Send your registered email address to request activation.</p></div><a href="https://wa.me/92${WHATSAPP_NUMBER.substring(1)}" target="_blank" rel="noopener" style="display:inline-block;background:#16a34a;color:white;padding:13px 22px;border-radius:12px;text-decoration:none;font-weight:700">💬 Contact on WhatsApp</a><br><button onclick="window.firebaseAuth.signOut()" style="margin-top:14px;border:0;background:none;color:#2563eb;font-weight:700;cursor:pointer">Back to Login</button></div></div>`;
    document.body.appendChild(box);
  }
  box.style.display="block";
}
function hideExpired(){const x=document.getElementById("expired-root");if(x)x.style.display="none";}
async function openSystem(){
  hideExpired();
  document.getElementById("auth-root").style.display="none";
  document.getElementById("root").style.display="block";
}
function showLogin(){
  document.getElementById("register-form").style.display="none";
  document.getElementById("login-form").style.display="block";
  document.getElementById("auth-sub").textContent="Login with your registered email and password";
  document.getElementById("auth-msg").textContent="";
}
function showRegister(){
  document.getElementById("login-form").style.display="none";
  document.getElementById("register-form").style.display="block";
  document.getElementById("auth-sub").textContent="Register to create your account";
  document.getElementById("auth-msg").textContent="";
}
function authMessage(text,color){
  const msg=document.getElementById("auth-msg");
  msg.style.color=color;
  msg.textContent=text;
}
function friendlyAuthError(err){
  const code=(err&&err.code)||"";
  if(code==="auth/email-already-in-use") return "This email is already registered. Please login.";
  if(code==="auth/invalid-email") return "Please enter a valid email address.";
  if(code==="auth/weak-password") return "Password should be at least 6 characters.";
  if(code==="auth/user-not-found"||code==="auth/wrong-password"||code==="auth/invalid-credential") return "Incorrect email or password.";
  return (err&&err.message)||"Authentication failed. Please try again.";
}

document.getElementById("register-form").addEventListener("submit",async function(e){
  e.preventDefault();
  const name=document.getElementById("reg-name").value.trim();
  const email=document.getElementById("reg-email").value.trim().toLowerCase();
  const password=document.getElementById("reg-password").value;
  try{
    const cred=await window.firebaseAuth.createUserWithEmailAndPassword(email,password);
    await window.firebaseDb.collection("users").doc(cred.user.uid).set({
      name:name,email:email,createdAt:firebase.firestore.FieldValue.serverTimestamp()
    },{merge:true});
    await ensureSubscription(cred.user);
    authMessage("Registration successful. Your 3-day free trial has started.","#16a34a");
  }catch(err){ authMessage(friendlyAuthError(err),"#dc2626"); }
});

document.getElementById("login-form").addEventListener("submit",async function(e){
  e.preventDefault();
  const email=document.getElementById("login-email").value.trim().toLowerCase();
  const password=document.getElementById("login-password").value;
  try{
    await window.firebaseAuth.signInWithEmailAndPassword(email,password);
    authMessage("Login successful. Loading your saved data...","#16a34a");
  }catch(err){ authMessage(friendlyAuthError(err),"#dc2626"); }
});

window.firebaseAuth.onAuthStateChanged(async function(user){
  if(user){
    window.CURRENT_UID=user.uid;
    try{
      const sub=await ensureSubscription(user);
      if(subscriptionExpired(sub)){ showExpired(sub); return; }
      openSystem();
    }catch(err){
      console.error("Subscription check failed:",err);
      authMessage("Could not verify your account access. Please try again.","#dc2626");
      await window.firebaseAuth.signOut();
    }
  }else{
    window.CURRENT_UID=null;
    hideExpired();
    document.getElementById("root").style.display="none";
    document.getElementById("auth-root").style.display="block";
  }
});
window.logoutSystem=async function(){ await window.firebaseAuth.signOut(); location.reload(); };
</script>
<script type="text/babel">
const {useState,useEffect,useMemo}=React;
const SOFTWARE_NAME="AL - FAISAL EDUCATION MANAGEMENT SYSTEM";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const today=()=>{let d=new Date(),o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)};
const thisMonth=()=>today().slice(0,7);
const money=v=>"Rs. "+Number(v||0).toLocaleString("en-PK");
const dateFmt=v=>v?new Date(v+"T00:00:00").toLocaleDateString("en-PK",{year:"numeric",month:"short",day:"numeric"}):"-";
const monthFmt=v=>{if(!v)return"-";let [y,m]=v.split("-");return new Date(+y,+m-1,1).toLocaleDateString("en-US",{month:"long",year:"numeric"})};

function Icon({n}){return <span className="inline-flex items-center justify-center text-lg">{({dashboard:"📊",students:"🎓",fees:"💰",expenses:"💸",salary:"💵",teacher:"👨‍🏫",plus:"＋",edit:"✏️",del:"🗑️",search:"🔎",menu:"☰",close:"✕",save:"💾",warn:"⚠️",chart:"📈"}[n]||"•")}</span>}

function AdminPanel(){
 const [email,setEmail]=useState(""),[result,setResult]=useState(null),[loading,setLoading]=useState(false),[message,setMessage]=useState("");
 async function findCustomer(){
   setLoading(true);setMessage("");setResult(null);
   try{
     const q=await window.firebaseDb.collection("users").where("email","==",email.trim().toLowerCase()).limit(1).get();
     if(q.empty){setMessage("Customer email not found.");return;}
     const d=q.docs[0]; const sub=await window.firebaseDb.collection("subscriptions").doc(d.id).get();
     setResult({uid:d.id,user:d.data()||{},sub:sub.exists?sub.data():null});
   }catch(e){setMessage("Search failed: "+(e.message||e));}
   finally{setLoading(false);}
 }
 async function activate(plan){
   if(!result)return;
   setLoading(true);setMessage("");
   try{
     const data={email:result.user.email||email.trim().toLowerCase(),plan,status:"active",updatedAt:firebase.firestore.FieldValue.serverTimestamp(),activatedAt:firebase.firestore.FieldValue.serverTimestamp(),activatedBy:ADMIN_UID};
     if(plan==="yearly"){
       const end=new Date(); end.setFullYear(end.getFullYear()+1); data.expiresAt=firebase.firestore.Timestamp.fromDate(end); data.trialEnd=null;
     }else{ data.expiresAt=null; data.trialEnd=null; }
     await window.firebaseDb.collection("subscriptions").doc(result.uid).set(data,{merge:true});
     const fresh=await window.firebaseDb.collection("subscriptions").doc(result.uid).get();
     setResult({...result,sub:fresh.data()});
     setMessage(plan==="yearly"?"Yearly access activated successfully.":"Lifetime access activated successfully.");
   }catch(e){setMessage("Activation failed: "+(e.message||e));}
   finally{setLoading(false);}
 }
 return <div className="max-w-3xl space-y-5">
   <div className="bg-white rounded-2xl p-6 shadow-card border border-blue-100">
    <h2 className="text-2xl font-extrabold">🔐 Customer Activation</h2>
    <p className="text-slate-500 mt-1">Search a customer's registered email and activate Yearly or Lifetime access.</p>
    <div className="flex flex-col sm:flex-row gap-3 mt-5">
      <input className="flex-1 border rounded-xl p-3" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="Customer registered email"/>
      <button onClick={findCustomer} disabled={loading||!email.trim()} className="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold">{loading?"Please wait…":"Search Customer"}</button>
    </div>
    {message&&<div className="mt-4 p-3 rounded-xl bg-slate-50 text-sm font-semibold">{message}</div>}
   </div>
   {result&&<div className="bg-white rounded-2xl p-6 shadow-card border">
     <h3 className="text-xl font-bold">Customer Found</h3>
     <div className="grid sm:grid-cols-2 gap-3 mt-4 text-sm">
       <div className="p-3 bg-slate-50 rounded-xl"><b>Email</b><br/>{result.user.email||email}</div>
       <div className="p-3 bg-slate-50 rounded-xl"><b>Current Plan</b><br/>{result.sub?.plan||"Not set"}</div>
       <div className="p-3 bg-slate-50 rounded-xl"><b>Status</b><br/>{result.sub?.status||"Not set"}</div>
       <div className="p-3 bg-slate-50 rounded-xl"><b>UID</b><br/><span className="break-all">{result.uid}</span></div>
     </div>
     <div className="grid sm:grid-cols-2 gap-3 mt-5">
       <button onClick={()=>activate("yearly")} disabled={loading} className="bg-blue-600 text-white p-3 rounded-xl font-bold">📅 Activate Yearly (1 Year)</button>
       <button onClick={()=>activate("lifetime")} disabled={loading} className="bg-purple-600 text-white p-3 rounded-xl font-bold">♾️ Activate Lifetime</button>
     </div>
   </div>}
 </div>
}

function App(){
 const [students,setStudents]=useState([]),[fees,setFees]=useState([]),[expenses,setExpenses]=useState([]),[salaries,setSalaries]=useState([]),[teachers,setTeachers]=useState([]),[copies,setCopies]=useState([]);
 const [tab,setTab]=useState("dashboard"),[mobile,setMobile]=useState(false),[feeMonth,setFeeMonth]=useState(thisMonth()),[reportPeriod,setReportPeriod]=useState("Monthly"),[reportDate,setReportDate]=useState(today());
 const [schoolName,setSchoolName]=useState("SCHOOL NAME");
 const [modal,setModal]=useState(null),[editing,setEditing]=useState(null),[search,setSearch]=useState("");
 const [cloudUid,setCloudUid]=useState(()=>window.CURRENT_UID||"");
 const [cloudReady,setCloudReady]=useState(false);

 // Every collection is loaded only from the CURRENT Firebase user's private UID path.
 useEffect(()=>{
   let stops=[];
   const stopAuth=window.firebaseAuth.onAuthStateChanged(user=>{
     stops.forEach(x=>x()); stops=[];
     if(!user){
       setCloudUid(""); setCloudReady(false);
       setStudents([]); setFees([]); setExpenses([]); setSalaries([]); setTeachers([]); setCopies([]);
       return;
     }
     // Clear the previous account immediately before loading the new account.
     const uid=user.uid;
     setCloudUid(uid); setCloudReady(false);
     setStudents([]); setFees([]); setExpenses([]); setSalaries([]); setTeachers([]); setCopies([]);
     setSchoolName("SCHOOL NAME");

     // Every record is strictly under the CURRENT Firebase Auth UID.
     const base=window.firebaseDb.collection("users").doc(uid);
     const watch=(name,setter)=>stops.push(base.collection(name).onSnapshot(snap=>{
       const active=window.firebaseAuth.currentUser;
       if(!active || active.uid!==uid) return;
       setter(snap.docs.map(d=>({id:d.id,...d.data()})));
     },err=>{ console.error("Private "+name+" load failed:",err); setter([]); }));
     watch("students",setStudents);
     watch("fees",setFees);
     watch("expenses",setExpenses);
     watch("teachers",setTeachers);
     watch("salaries",setSalaries);
     watch("copies",setCopies);
     base.get().then(async s=>{
       const d=s.data()||{};
       if(d.schoolName)setSchoolName(d.schoolName);
       // One-time migration from the previous schoolData/{uid} document, if this user has old cloud data.
       if(!d.uidPrivateMigrationV2){
         try{
           const legacy=await window.firebaseDb.collection("schoolData").doc(uid).get();
           if(legacy.exists){
             const old=legacy.data()||{}; const batch=window.firebaseDb.batch();
             const migrate=(name,arr)=>{(Array.isArray(arr)?arr:[]).forEach(x=>{const id=x.id||uid()+Math.random().toString(36).slice(2); const {id:legacyId,...data}=x||{}; batch.set(base.collection(name).doc(id),{...data,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});});};
             migrate("students",old.students); migrate("fees",old.fees); migrate("expenses",old.expenses); migrate("teachers",old.teachers); migrate("salaries",old.salaries); migrate("copies",old.copies);
             batch.set(base,{uidPrivateMigrationV2:true,schoolName:old.schoolName||d.schoolName||"SCHOOL NAME",updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
             await batch.commit();
             if(old.schoolName)setSchoolName(old.schoolName);
           }else await base.set({uidPrivateMigrationV2:true},{merge:true});
         }catch(e){console.error("Private data migration failed:",e);}
       }
       setCloudReady(true);
     }).catch(e=>{console.error("Profile load failed:",e);setCloudReady(true)});
   });
   return ()=>{stopAuth();stops.forEach(x=>x())};
 },[]);

 const privateCollection=(name)=>{
   if(!cloudUid) throw new Error("Please login first.");
   return window.firebaseDb.collection("users").doc(cloudUid).collection(name);
 };
 const writeRecord=async(name,id,data)=>{
   try{
     await privateCollection(name).doc(id).set({...data,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
   }catch(e){ console.error("Save failed:",e); alert("Cloud save failed: "+(e.message||e)); }
 };
 const deleteRecord=async(name,id)=>{
   try{ await privateCollection(name).doc(id).delete(); }
   catch(e){ console.error("Delete failed:",e); alert("Cloud delete failed: "+(e.message||e)); }
 };

 // School name is also stored inside this user's private profile document.
 useEffect(()=>{
   if(!cloudUid||!cloudReady)return;
   const t=setTimeout(()=>window.firebaseDb.collection("users").doc(cloudUid).set({schoolName,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}),400);
   return ()=>clearTimeout(t);
 },[cloudUid,cloudReady,schoolName]);

 const savePrivate=async(name,data,existingId)=>{
   const id=existingId||uid();
   await writeRecord(name,id,data);
   return id;
 };

 const m=thisMonth(),td=today();
 const expectedFee=students.filter(x=>x.status!=="Inactive").reduce((a,x)=>a+(+x.monthlyFee||0),0); const monthlyFees=fees.filter(x=>(x.month||x.date?.slice(0,7))===m&&x.paymentStatus==="Paid").reduce((a,x)=>a+ +x.amount,0); const paidFee=monthlyFees; const remainingFee=Math.max(0,expectedFee-paidFee);
 const todayFees=fees.filter(x=>x.date===td&&x.paymentStatus==="Paid").reduce((a,x)=>a+ +x.amount,0);
 const monthlySalary=salaries.filter(x=>x.month===m).reduce((a,x)=>a+ +x.amount,0);
 const monthlyExpense=expenses.filter(x=>(x.month||x.date?.slice(0,7))===m).reduce((a,x)=>a+ +x.amount,0);
 const net=monthlyFees-monthlyExpense;
 const activeTeachers=teachers.filter(t=>t.status!=="Inactive").length;
 const activeStudents=students.filter(s=>s.status!=="Inactive").length;
 const defaulters=students.filter(s=>s.status!=="Inactive"&&!fees.some(f=>String(f.studentId)===String(s.id)&&(f.month||f.date?.slice(0,7))===m&&f.paymentStatus==="Paid"));

 function nav(t){setTab(t);setMobile(false);setSearch("")}
 function close(){setModal(null);setEditing(null)}
 async function submitStudent(d){await savePrivate("students",d,editing?.id);close()}
 async function submitTeacher(d){await savePrivate("teachers",d,editing?.id);close()}
 async function submitFee(d){let st=students.find(x=>String(x.id)===String(d.studentId));d.studentName=st?.name||"Unknown";await savePrivate("fees",d,editing?.id);close()}
 async function submitExpense(d){await savePrivate("expenses",{...d,autoSalaryId:editing?.autoSalaryId||null},editing?.id);close()}
 async function submitSalary(d){
   if(editing){
     await savePrivate("salaries",d,editing.id);
     const linked=expenses.find(e=>e.autoSalaryId===editing.id);
     if(linked) await savePrivate("expenses",{...linked,name:`Teacher Salary - ${d.teacherName} - ${monthFmt(d.month)}`,amount:+d.amount,date:d.paymentDate,month:d.month,notes:d.notes||"",expenseType:"Teacher Salary",autoSalaryId:editing.id},linked.id);
   }else{
     const id=uid();
     await savePrivate("salaries",d,id);
     await savePrivate("expenses",{name:`Teacher Salary - ${d.teacherName} - ${monthFmt(d.month)}`,amount:+d.amount,date:d.paymentDate,month:d.month,notes:d.notes||"",autoSalaryId:id,expenseType:"Teacher Salary"});
   }
   close()
 }
 async function del(type,id){
   if(!confirm("Delete this record?"))return;
   if(type==="student")await deleteRecord("students",id);
   if(type==="teacher")await deleteRecord("teachers",id);
   if(type==="fee")await deleteRecord("fees",id);
   if(type==="expense"){let e=expenses.find(x=>x.id===id);if(e?.autoSalaryId){alert("Delete this expense from Teacher Salary.");return}await deleteRecord("expenses",id)}
   if(type==="salary"){
     const linked=expenses.filter(x=>x.autoSalaryId===id);
     await deleteRecord("salaries",id);
     for(const e of linked) await deleteRecord("expenses",e.id);
   }
   if(type==="copy")await deleteRecord("copies",id);
 }
 const navs=[["dashboard","Dashboard","dashboard"],["students","Students","students"],["fees","Fee Collection","fees"],["expenses","Expenses","expenses"],["salary","Teacher Salary","salary"],["teachers","Teacher Service","teacher"],["classes","Classes","students"],["reports","Reports","chart"],["copies","Copies","fees"],["settings","Settings","settings"],...(cloudUid===ADMIN_UID?[["admin","Customer Activation","settings"]]:[])];

  {(()=>{const d=new Date(reportDate+"T00:00:00");const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),monthKey=`${y}-${m}`;const dayStart=new Date(d);const dayEnd=new Date(d);dayEnd.setDate(d.getDate()+1);const weekStart=new Date(d);weekStart.setDate(d.getDate()-d.getDay());const weekEnd=new Date(weekStart);weekEnd.setDate(weekStart.getDate()+7);

 let max=Math.max(...charts.map(x=>x.v),1),normal=p.expenses.filter(x=>x.month===selectedMonth&&!x.autoSalaryId).reduce((a,x)=>a+ +x.amount,0),selectedSalary=p.salaries.filter(x=>x.month===selectedMonth).reduce((a,x)=>a+ +x.amount,0),total=normal+selectedSalary,sp=total?Math.round(selectedSalary/total*100):0;

    <Stat t={`Copies & Extra (${monthFmt(selectedMonth)})`} v={money((p.copies||[]).filter(x=>x.month===selectedMonth).reduce((a,x)=>a+(+x.copyAmount||0)+(+x.extraAmount||0),0))} i="fees"/>
   </div>

   <div className="grid xl:grid-cols-2 gap-5">
    <div className="bg-white rounded-2xl p-5 shadow-card border border-blue-100"><h3 className="font-bold text-lg text-blue-700">📊 Monthly Fee Collection</h3><p className="text-sm text-slate-500 mb-5">Last 6 months</p><div className="h-56 flex items-end gap-3">{charts.map(x=><div key={x.k} className="flex-1 h-full flex flex-col justify-end items-center"><span className="text-xs text-slate-500">{x.v?Math.round(x.v/1000)+"k":"0"}</span><div className="w-full max-w-12 bg-gradient-to-t from-indigo-600 via-blue-500 to-cyan-400 rounded-t" style={{height:Math.max(4,x.v/max*190)}}></div><span className="text-xs mt-2">{x.l}</span></div>)}</div></div>
    <div className="bg-white rounded-2xl p-5 shadow-card border border-purple-100"><h3 className="font-bold text-lg text-purple-700">🥧 Expense Distribution</h3><p className="text-sm text-slate-500 mb-5">{monthFmt(selectedMonth)}</p><div className="flex flex-col sm:flex-row items-center gap-8"><div className="w-44 h-44 rounded-full" style={{background:`conic-gradient(#f97316 0 ${sp}%,#6366f1 ${sp}% 100%)`}}></div><div className="space-y-4 w-full"><p>🟠 Teacher Salaries: <b>{money(selectedSalary)}</b> ({sp}%)</p><p>🔵 Other Expenses: <b>{money(normal)}</b> ({100-sp}%)</p><hr/><p className="font-bold">Total Expenses: {money(total)}</p></div></div></div>
   </div>

   <div className="bg-white rounded-2xl shadow-card overflow-hidden border border-rose-100"><div className="p-5 border-b bg-gradient-to-r from-rose-50 to-orange-50"><h3 className="font-bold text-lg text-rose-700">⚠️ Fee Defaulters</h3><p className="text-sm text-slate-500">Students without a payment for {monthFmt(selectedMonth)}</p></div>{selectedDefaulters.length?<div className="overflow-x-auto"><table className="w-full text-sm"><thead className="bg-slate-50"><tr><th className="p-3 text-left">Student</th><th className="p-3 text-left">Class</th><th className="p-3 text-right">Monthly Fee</th></tr></thead><tbody>{selectedDefaulters.slice(0,15).map(x=><tr className="border-t" key={x.id}><td className="p-3 font-semibold">{x.name}</td><td className="p-3">{x.className||"-"}</td><td className="p-3 text-right text-red-600">{money(x.monthlyFee)}</td></tr>)}</tbody></table></div>:<div className="p-8 text-center">🎉 No fee defaulters!</div>}</div>
  </div>
}
function Stat({t,v,i}){const styles={students:"from-blue-500 to-cyan-500",teacher:"from-violet-500 to-purple-600",fees:"from-emerald-500 to-teal-500",salary:"from-orange-500 to-amber-500",chart:"from-pink-500 to-rose-500"};return <div className="bg-white rounded-2xl shadow-card overflow-hidden hover:-translate-y-1 transition"><div className={"h-1.5 bg-gradient-to-r "+(styles[i]||"from-blue-500 to-indigo-500")}></div><div className="p-4 flex justify-between items-center"><div><p className="text-xs text-slate-500 font-semibold">{t}</p><b className="text-xl block mt-2 text-slate-800">{v}</b></div><span className={"w-11 h-11 rounded-xl bg-gradient-to-br "+(styles[i]||"from-blue-500 to-indigo-500")+" text-white flex items-center justify-center text-xl"}><Icon n={i}/></span></div></div>}

function Records({title,desc,add,search,setSearch,rows,cols,render,onAdd,onEdit,onDelete}){
 return <div><div className="flex flex-col sm:flex-row justify-between gap-3 mb-5"><div><h2 className="text-xl font-bold">{title}</h2><p className="text-sm text-slate-500">{desc}</p></div><button onClick={onAdd} className="bg-blue-600 text-white px-4 py-3 rounded-xl font-semibold">＋ {add}</button></div><div className="bg-white rounded-2xl shadow-card overflow-hidden"><div className="p-4 border-b"><div className="relative"><span className="absolute left-3 top-2.5"><Icon n="search"/></span><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search..." className="w-full border rounded-xl p-2.5 pl-10 outline-none focus:ring-2 focus:ring-blue-500"/></div></div>{!rows.length?<div className="p-12 text-center text-slate-500">No records found.</div>:<div className="overflow-x-auto"><table className="w-full text-sm min-w-[800px]"><thead className="bg-slate-50"><tr>{cols.map(c=><th className="p-3 text-left" key={c}>{c}</th>)}<th className="p-3 text-center">Actions</th></tr></thead><tbody>{rows.map(x=><tr className="border-t hover:bg-slate-50" key={x.id}>{render(x)}<td className="p-3"><div className="flex justify-center gap-2"><button onClick={()=>onEdit(x)} className="bg-blue-50 text-blue-600 p-2 rounded-lg">✏️</button><button onClick={()=>onDelete(x)} className="bg-red-50 text-red-600 p-2 rounded-lg">🗑️</button></div></td></tr>)}</tbody></table></div>}</div></div>
}
function Modal({title,children,close}){return <div className="fixed inset-0 z-[100] modal-bg flex items-center justify-center p-3"><div className="bg-white rounded-2xl w-full max-w-2xl max-h-[94vh] overflow-y-auto"><div className="sticky top-0 bg-white border-b p-4 flex justify-between"><h2 className="font-bold text-lg">{title}</h2><button onClick={close}><Icon n="close"/></button></div><div className="p-5">{children}</div></div></div>}
const In=({label,...p})=><label className="block"><span className="block text-sm font-semibold mb-1">{label}</span><input {...p} className="w-full border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500"/></label>;
const Sel=({label,children,...p})=><label className="block"><span className="block text-sm font-semibold mb-1">{label}</span><select {...p} className="w-full border rounded-lg p-2.5 bg-white outline-none focus:ring-2 focus:ring-blue-500">{children}</select></label>;
const Area=({label,...p})=><label className="block"><span className="block text-sm font-semibold mb-1">{label}</span><textarea {...p} className="w-full border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500"/></label>;
function Custom({fields,setFields}){function add(){setFields([...fields,{id:uid(),name:"",value:""}])}return <div className="mt-5 pt-5 border-t"><div className="flex justify-between mb-3"><b>Custom Fields</b><button type="button" onClick={add} className="text-blue-600 font-semibold">+ Add Custom Field</button></div>{fields.map(f=><div className="grid sm:grid-cols-[1fr_1fr_auto] gap-2 mb-2" key={f.id}><input value={f.name} onChange={e=>setFields(fields.map(x=>x.id===f.id?{...x,name:e.target.value}:x))} placeholder="Field name" className="border rounded-lg p-2"/><input value={f.value} onChange={e=>setFields(fields.map(x=>x.id===f.id?{...x,value:e.target.value}:x))} placeholder="Value" className="border rounded-lg p-2"/><button type="button" onClick={()=>setFields(fields.filter(x=>x.id!==f.id))} className="bg-red-50 text-red-600 rounded-lg px-3">🗑️</button></div>)}</div>}
function Buttons({close,text}){return <div className="flex justify-end gap-2 mt-6 pt-4 border-t"><button type="button" onClick={close} className="border px-5 py-2.5 rounded-lg">Cancel</button><button className="bg-blue-600 text-white px-5 py-2.5 rounded-lg">{text}</button></div>}
function StudentModal({initial,close,save}){let[f,setF]=useState({name:initial?.name||"",fatherName:initial?.fatherName||"",className:initial?.className||"",rollNo:initial?.rollNo||"",monthlyFee:initial?.monthlyFee||"",admissionDate:initial?.admissionDate||today(),phone:initial?.phone||"",address:initial?.address||"",status:initial?.status||"Active",notes:initial?.notes||""}),[cf,setCf]=useState(initial?.customFields||[]);return <Modal title={initial?"Edit Student":"Add Student"} close={close}><form onSubmit={e=>{e.preventDefault();save({...f,monthlyFee:+f.monthlyFee,customFields:cf})}}><div className="grid sm:grid-cols-2 gap-4"><In label="Student Name" required value={f.name} onChange={e=>setF({...f,name:e.target.value})}/><In label="Father Name" value={f.fatherName} onChange={e=>setF({...f,fatherName:e.target.value})}/><Sel label="Class" value={f.className} onChange={e=>setF({...f,className:e.target.value})}>
<option value="">Select Class</option><option>Play Group</option><option>Nursery</option><option>Prep</option><option>1st</option><option>2nd</option><option>3rd</option><option>4th</option><option>5th</option><option>6th</option><option>7th</option><option>8th</option><option>9th</option><option>10th</option>
</Sel><In label="Roll Number" value={f.rollNo} onChange={e=>setF({...f,rollNo:e.target.value})}/><In label="Monthly Fee" type="number" value={f.monthlyFee} onChange={e=>setF({...f,monthlyFee:e.target.value})}/><In label="Admission Date" type="date" value={f.admissionDate} onChange={e=>setF({...f,admissionDate:e.target.value})}/><In label="Phone" value={f.phone} onChange={e=>setF({...f,phone:e.target.value})}/><Sel label="Status" value={f.status} onChange={e=>setF({...f,status:e.target.value})}><option>Active</option><option>Inactive</option></Sel></div><div className="mt-4"><Area label="Address" rows="2" value={f.address} onChange={e=>setF({...f,address:e.target.value})}/></div><div className="mt-4"><Area label="Notes" rows="2" value={f.notes} onChange={e=>setF({...f,notes:e.target.value})}/></div><Custom fields={cf} setFields={setCf}/><Buttons close={close} text={initial?"Update Student":"Add Student"}/></form></Modal>}
function TeacherModal({initial,close,save}){let[f,setF]=useState({name:initial?.name||"",fatherName:initial?.fatherName||"",cnic:initial?.cnic||"",phone:initial?.phone||"",subject:initial?.subject||"",qualification:initial?.qualification||"",joiningDate:initial?.joiningDate||today(),status:initial?.status||"Active",monthlySalary:initial?.monthlySalary||"",address:initial?.address||"",notes:initial?.notes||""}),[cf,setCf]=useState(initial?.customFields||[]);let ch=(k,v)=>setF({...f,[k]:v});return <Modal title={initial?"Edit Teacher Service":"Add Teacher Service"} close={close}><form onSubmit={e=>{e.preventDefault();save({...f,monthlySalary:+f.monthlySalary,customFields:cf})}}><div className="grid sm:grid-cols-2 gap-4"><In label="Teacher Name" required value={f.name} onChange={e=>ch("name",e.target.value)}/><In label="Father Name" value={f.fatherName} onChange={e=>ch("fatherName",e.target.value)}/><In label="CNIC / ID" value={f.cnic} onChange={e=>ch("cnic",e.target.value)}/><In label="Phone Number" value={f.phone} onChange={e=>ch("phone",e.target.value)}/><In label="Subject" value={f.subject} onChange={e=>ch("subject",e.target.value)}/><In label="Qualification" value={f.qualification} onChange={e=>ch("qualification",e.target.value)}/><In label="Joining Date" type="date" value={f.joiningDate} onChange={e=>ch("joiningDate",e.target.value)}/><Sel label="Service Status" value={f.status} onChange={e=>ch("status",e.target.value)}><option>Active</option><option>Inactive</option></Sel><In label="Monthly Salary" type="number" value={f.monthlySalary} onChange={e=>ch("monthlySalary",e.target.value)}/></div><div className="mt-4"><Area label="Address" rows="2" value={f.address} onChange={e=>ch("address",e.target.value)}/></div><div className="mt-4"><Area label="Notes" rows="2" value={f.notes} onChange={e=>ch("notes",e.target.value)}/></div><Custom fields={cf} setFields={setCf}/><Buttons close={close} text={initial?"Update Teacher":"Add Teacher"}/></form></Modal>}
function FeeModal({initial,students,selectedMonth,close,save}){
 let[f,setF]=useState({
  studentId:initial?.studentId||"",
  studentName:initial?.studentName||"",
  className:initial?.className||"",
  amount:initial?.amount||"",
  month:initial?.month||selectedMonth||thisMonth(),
  date:initial?.date||today(),
  paymentStatus:initial?.paymentStatus||"Paid",
  notes:initial?.notes||""
 }),[cf,setCf]=useState(initial?.customFields||[]);
 let ch=(k,v)=>setF({...f,[k]:v});
 function studentChange(v){
  let st=students.find(x=>String(x.id)===String(v));
  setF({...f,studentId:v,studentName:st?.name||"",className:st?.className||"",amount:st?.monthlyFee||""});
 }
 return <Modal title={initial?"Edit Fee":"Add Fee"} close={close}>
  <form onSubmit={e=>{e.preventDefault();if(!f.studentId){alert("Please select a student.");return}save({...f,amount:+f.amount,customFields:cf})}}>
   <div className="grid sm:grid-cols-2 gap-4">
    <Sel label="Student Name" required value={f.studentId} onChange={e=>studentChange(e.target.value)}>
     <option value="">Select Student</option>
     {students.filter(s=>s.status!=="Inactive").map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
    </Sel>
    <In label="Class" value={f.className} readOnly placeholder="Auto from Student"/>
    <In label="Monthly Fee" required type="number" value={f.amount} readOnly placeholder="Auto from Student"/>
    <In label="Fee Month" required type="month" value={f.month} onChange={e=>ch("month",e.target.value)}/>
    <In label="Payment Date" type="date" value={f.date} onChange={e=>ch("date",e.target.value)}/>
   </div>
   <div className="mt-5">
    <span className="block text-sm font-semibold mb-2">Fee Status</span>
    <div className="grid grid-cols-2 gap-3">
     <button type="button" onClick={()=>ch("paymentStatus","Paid")} className={`p-3 rounded-xl border-2 font-bold ${f.paymentStatus==="Paid"?"border-green-500 bg-green-50 text-green-700":"border-slate-200 text-slate-500"}`}>✓ Paid</button>
     <button type="button" onClick={()=>ch("paymentStatus","Unpaid")} className={`p-3 rounded-xl border-2 font-bold ${f.paymentStatus==="Unpaid"?"border-red-500 bg-red-50 text-red-700":"border-slate-200 text-slate-500"}`}>✕ Unpaid</button>
    </div>
   </div>
   <div className="mt-4"><Area label="Notes" rows="3" value={f.notes} onChange={e=>ch("notes",e.target.value)}/></div>
   <Custom fields={cf} setFields={setCf}/>
   <div className="flex justify-end gap-2 mt-6 pt-4 border-t">
    <button type="button" onClick={close} className="border px-5 py-2.5 rounded-lg">Cancel</button>
    <button type="button" onClick={()=>{if(!f.studentId){alert("Please select a student.");return}save({...f,amount:+f.amount,paymentStatus:"Paid",date:f.date||today(),customFields:cf})}} className="bg-green-600 text-white px-5 py-2.5 rounded-lg font-semibold">✓ Mark as Paid & Save</button>
    <button type="submit" className="bg-blue-600 text-white px-5 py-2.5 rounded-lg">{initial?"Update Fee":"Save Fee"}</button>
   </div>
  </form>
 </Modal>
}
function ExpenseModal({initial,close,save}){let[f,setF]=useState({name:initial?.name||"",amount:initial?.amount||"",month:initial?.month||thisMonth(),date:initial?.date||today(),notes:initial?.notes||""}),[cf,setCf]=useState(initial?.customFields||[]);let ch=(k,v)=>setF({...f,[k]:v});return <Modal title={initial?"Edit Expense":"Add Expense"} close={close}><form onSubmit={e=>{e.preventDefault();save({...f,amount:+f.amount,customFields:cf})}}><div className="space-y-4"><In label="Expense Name" required value={f.name} onChange={e=>ch("name",e.target.value)}/><div className="grid sm:grid-cols-2 gap-4"><In label="Amount" required type="number" value={f.amount} onChange={e=>ch("amount",e.target.value)}/><In label="Date" type="date" value={f.date} onChange={e=>ch("date",e.target.value)}/><In label="Month" type="month" value={f.month} onChange={e=>ch("month",e.target.value)}/></div><Area label="Notes" rows="3" value={f.notes} onChange={e=>ch("notes",e.target.value)}/></div><Custom fields={cf} setFields={setCf}/><Buttons close={close} text={initial?"Update Expense":"Add Expense"}/></form></Modal>}
function SalaryModal({initial,teachers,close,save}){let[f,setF]=useState({teacherId:initial?.teacherId||"",teacherName:initial?.teacherName||"",month:initial?.month||thisMonth(),amount:initial?.amount||"",paymentDate:initial?.paymentDate||today(),notes:initial?.notes||""}),[cf,setCf]=useState(initial?.customFields||[]);let ch=(k,v)=>setF({...f,[k]:v});function teacherChange(v){let t=teachers.find(x=>String(x.id)===String(v));setF({...f,teacherId:v,teacherName:t?.name||"",amount:t?.monthlySalary||f.amount})}return <Modal title={initial?"Edit Teacher Salary":"Add Teacher Salary"} close={close}><form onSubmit={e=>{e.preventDefault();save({...f,customFields:cf})}}><div className="grid sm:grid-cols-2 gap-4"><Sel label="Teacher Name" required value={f.teacherId} onChange={e=>teacherChange(e.target.value)}><option value="">Select Teacher</option>{teachers.map(t=><option key={t.id} value={t.id}>{t.name}{t.subject?" — "+t.subject:""}</option>)}</Sel><In label="Month" required type="month" value={f.month} onChange={e=>ch("month",e.target.value)}/><In label="Amount" required type="number" value={f.amount} onChange={e=>ch("amount",e.target.value)}/><In label="Payment Date" required type="date" value={f.paymentDate} onChange={e=>ch("paymentDate",e.target.value)}/></div><div className="mt-4"><Area label="Notes" rows="3" value={f.notes} onChange={e=>ch("notes",e.target.value)}/></div><div className="mt-4 p-3 bg-orange-50 rounded-lg text-sm text-orange-800">Saving this salary automatically creates an Expense: <b>Teacher Salary - {f.teacherName||"[Teacher Name]"} - {monthFmt(f.month)}</b></div><Custom fields={cf} setFields={setCf}/><Buttons close={close} text={initial?"Update Salary":"Add Salary"}/></form></Modal>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
